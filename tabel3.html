<!DOCTYPE html>
<html lang="en">
<head>

    <title>Membuat Tabel 3 HTML</title>
</head>
<body>
<table border="1">

    <tr>

        <th bgcolor="blue">Ayam Geprek</th>
    </tr>
    <tr>
        <td>Januari</td>
        <td>100</td>
        <td>150</td>
    </tr>
    <tr>
        <td>Febuari</td>
        <td>90</td>
        <td>100</td>
    </tr>
    <tr>
        <td>Maret</td>
        <td>190</td>
        <td>100</td>
    </tr>
</table>

</body>
</html>
